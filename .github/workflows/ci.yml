name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: cellrel, MYSQL_USER: cellrel, MYSQL_PASSWORD: cellrel}
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ping:1}).ok'" --health-interval=5s --health-timeout=5s --health-retries=20
      kafka:
        image: apache/kafka:3.8.0
        ports: ["9092:9092"]
    env:
      CI_REQUIRE_SERVICES: "1"
      MYSQL_URL: mysql://cellrel:cellrel@127.0.0.1:3306/cellrel
      MONGO_URI: mongodb://127.0.0.1:27017
      KAFKA_BOOTSTRAP: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,services]"
      - name: wait for kafka
        run: |
          for i in $(seq 1 30); do python -c "from kafka import KafkaAdminClient; KafkaAdminClient(bootstrap_servers='127.0.0.1:9092').list_topics()" && break; sleep 2; done
      - run: cellrel run
      - run: pytest -v -rs tests/integration
      - run: cellrel publish-mysql && cellrel publish-mongo && cellrel stream-kafka | tail -20
